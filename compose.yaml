# Compose racine — stack complète pour le développement local (hors spring-boot-docker-compose)
# Usage : docker compose up --build
# Pour le dev quotidien, utiliser backend/compose.yaml (démarré automatiquement par Spring Boot).

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clicclap
      POSTGRES_USER: clicclap
      POSTGRES_PASSWORD: clicclap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clicclap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clicclap
      SPRING_DATASOURCE_USERNAME: clicclap
      SPRING_DATASOURCE_PASSWORD: clicclap
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${ZITADEL_ISSUER}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
