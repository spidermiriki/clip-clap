spring.application.name=clipclap

# La source de données est fournie par compose.yaml (Spring Boot Docker Compose).
# schema.sql et data.sql sont exécutés à chaque démarrage : ils doivent rester idempotents.
spring.sql.init.mode=always

springdoc.swagger-ui.path=/swagger-ui.html

# Zitadel : les tokens doivent venir de notre instance et être destinés à notre projet.
# Les clés publiques de vérification sont téléchargées depuis l'issuer au premier appel.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ZITADEL_ISSUER:https://clic-clap-jiufbb.eu1.zitadel.cloud}
spring.security.oauth2.resourceserver.jwt.audiences=${ZITADEL_PROJECT_ID:395951731327930510}

# Port dynamique injecté par Render (fallback 8080 en local)
server.port=${PORT:8080}

# Actuator : expose uniquement /actuator/health (route de santé Render)
management.endpoints.web.exposure.include=health

# Spring Boot Docker Compose : compose.yaml unique à la racine (seul 'db' démarre en dev).
spring.docker.compose.file=../compose.yaml
