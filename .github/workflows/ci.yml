name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon
